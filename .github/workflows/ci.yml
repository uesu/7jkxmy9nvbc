name: CI — syntax + offline smoke test

# Safety gate for Dependabot PRs (and any PR): proves the monitor scripts
# still install and compile after a dependency or runtime bump BEFORE anything
# can be merged to main. Runs on every PR + push to main.
#
# Supply chain (round 57 + round 89): every `uses:` stays pinned to an
# immutable 40-hex commit SHA, and its version comment stays a BARE
# `# vX.Y.Z` at end of line. zizmor's ref-version-mismatch audit only
# verifies a pin whose comment it can parse, so an annotated comment
# ("# v7 — SHA-pinned ...") silently disables that check — put notes on the
# line above instead. Guarded by tests/test_smoke.py (r89).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Round 57: hard cap — suites finish in ~2 min; 15 is a generous ceiling.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          # Exact stable CPython pin; update deliberately after CI validates it.
          python-version: '3.14.8'
          cache: 'pip'

      - name: Install dependencies (a broken requirements.txt fails HERE, not in production)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile every .py file (syntax errors fail here)
        run: python -m compileall -q "testing area" tests

      - name: Offline smoke test (no network, no secrets needed)
        run: python tests/test_smoke.py

      - name: Reddit signal unit tests (pure, no network)
        run: python tests/test_reddit_signals.py

      - name: Twitter media unit tests (pure, no network)
        run: python tests/test_twitter_media.py
