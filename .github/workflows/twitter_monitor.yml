name: Twitter Feed Monitor

concurrency:
  # P0 DOUBLE-POST FIX (2026-09-19): same reason as the Reddit monitor —
  # a trigger arriving mid-run QUEUES and starts later. ROUND 61 CORRECTION
  # (2026-10-04): the queued run does NOT see the newest main by itself —
  # workflow_dispatch pins GITHUB_SHA at dispatch time, so it starts on a
  # STALE tip without the first run's fresh posted_tweets.json (the exact
  # mechanism of the 2026-10-03 Reddit double post). The "Sync to the live
  # branch tip" step below closes that gap; the group is still required so
  # two runs never execute at once.
  # cancel-in-progress MUST stay false: a run can sit between "Discord
  # posted" and "cache committed" — cancelling it there would lose the
  # cache update and allow a re-post.
  group: check-twitter-${{ github.ref }}
  cancel-in-progress: false

on:
  # ── GITHUB NATIVE SCHEDULE: DISABLED (2026-09-17) ────────────────────────
  # It raced with the cron-job.org workflow_dispatch triggers: both checked
  # out the same pre-cache commit, both posted the same tweet, and the 2nd
  # cache push was rejected (non-fast-forward). cron-job.org is now the
  # SINGLE scheduler for this monitor. To re-enable GitHub's own schedule,
  # uncomment these two lines AND pause the cron-job.org job:
  #   schedule:
  #     - cron: '*/10 * * * *'
  workflow_dispatch:          # allows manual + external-cron triggering
    inputs:
      test_tweet:
        description: 'Optional TEST TWEET: rebuild ONE specific tweet, e.g. Wuthering_Waves/2100555373073797461 (nitter feed bypassed; same pipeline + cache). Leave empty for a normal run.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check-twitter:
    runs-on: ubuntu-latest
    # Round 57: hard cap — a hung network call otherwise blocks the concurrency queue for GitHub's 6 h default.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Round 61 (2026-10-04): workflow_dispatch pins GITHUB_SHA at dispatch
      # time, so a run queued behind another starts on a STALE tip — without
      # the previous run's fresh dedup cache. Fast-forward to the LIVE tip
      # before anything reads the caches; an unqueued run is already there
      # and this is a no-op.
      - name: Sync to the live branch tip
        env:
          CACHE_BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "${CACHE_BRANCH:-main}"
          git reset --hard FETCH_HEAD
          echo "Now at $(git log -1 --format=%H) (live ${CACHE_BRANCH:-main} tip)."

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          # Exact stable CPython pin; update deliberately after CI validates it.
          python-version: '3.14.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Twitter Feed Monitor
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_TYPEII_EN: ${{ secrets.WEBHOOK_TYPEII_EN }}
          WEBHOOK_POMPOM_HONKAISR: ${{ secrets.WEBHOOK_POMPOM_HONKAISR }}
          WEBHOOK_WUTHERING_WAVES: ${{ secrets.WEBHOOK_WUTHERING_WAVES }}
          WEBHOOK_HONKAINA: ${{ secrets.WEBHOOK_HONKAINA }}
          WEBHOOK_ANANTA_EN: ${{ secrets.WEBHOOK_ANANTA_EN }}
          # Test tools (2026-09-17): manual runs only. TEST_TWEET_ID rebuilds
          # one specific tweet via the direct FxTwitter path (nitter-free).
          TEST_TWEET_ID: ${{ github.event.inputs.test_tweet }}
          # Nitter RSS token (2026-09-17): nitter.miningtcup.me is behind a
          # bot check. The emailed RSS token lives in the NITTER_RSS_TOKEN
          # repo SECRET (Settings -> Secrets and variables -> Actions ->
          # Secrets -> NITTER_RSS_TOKEN) — GitHub masks secret values in
          # every log line, so it can never print in the Actions log.
          # The next run picks it up, no code change.
          # Empty = the chain just skips that instance.
          NITTER_RSS_TOKEN: ${{ secrets.NITTER_RSS_TOKEN }}
          # Round 34: per-account retention and global backstop. Empty
          # Variables keep the defaults (250/account, 10,000 total).
          MAX_CACHE_SIZE_PER_ACCOUNT: ${{ vars.MAX_CACHE_SIZE_PER_ACCOUNT }}
          MAX_CACHE_SIZE_TOTAL: ${{ vars.MAX_CACHE_SIZE_TOTAL }}
          # Round 47 (2026-10-01): media self-heal. When Discord's media
          # proxy returns a gallery tile with no dimensions/content-type
          # (the "Image failed to load" case), the monitor re-sends the
          # IDENTICAL payload as an edit after MEDIA_HEAL_DELAY_SECONDS,
          # which makes Discord resolve the asset. Runs AFTER the posting
          # loop, so posting speed is unchanged. Optional Variables:
          #   MEDIA_HEAL=off              disable it
          #   MEDIA_HEAL_DELAY_SECONDS=45 wait before each re-edit
          #   MEDIA_HEAL_ATTEMPTS=4       max re-edits per message (default 4,
          #                               hard-capped at 4)
          #   MEDIA_HEAL_SCOPE=video      round 56 default: only video
          #                               renditions are re-edited — the one
          #                               media type whose tile actually
          #                               breaks when Discord's proxy is cold
          #   MEDIA_HEAL_SCOPE=on (/all)  also heal photos/gif/webp (full
          #                               round-47 scope)
          #   MEDIA_HEAL_SCOPE=off        never re-edit any media
          # Optional high video limit: unset/false keeps the 256 MiB default.
          TWITTER_HIGH_VIDEO_LIMIT: ${{ vars.TWITTER_HIGH_VIDEO_LIMIT }}
          # Round 95c: stale-backlog floor. An entry older than this many
          # hours is refused (STALE-SKIP) before any tweet-data request, so a
          # degraded nitter mirror that answers `feed OK` with a days-old
          # backlog cannot post old tweets as news. Unset/empty keeps 24 h.
          #   TWITTER_MAX_AGE_HOURS=0     switch the guard off entirely
          #   TWITTER_MAX_AGE_HOURS=48    keep a two-day catch-up window
          TWITTER_MAX_AGE_HOURS: ${{ vars.TWITTER_MAX_AGE_HOURS }}
          MEDIA_HEAL: ${{ vars.MEDIA_HEAL }}
          MEDIA_HEAL_DELAY_SECONDS: ${{ vars.MEDIA_HEAL_DELAY_SECONDS }}
          MEDIA_HEAL_ATTEMPTS: ${{ vars.MEDIA_HEAL_ATTEMPTS }}
          MEDIA_HEAL_SCOPE: ${{ vars.MEDIA_HEAL_SCOPE }}
        # ───────────────────────────────────────────────────────────────────
        # TESTING AREA (how updates ship):
        # • A new/changed script lives in "testing area/" FIRST (e.g.
        #   twitter_v3.py). Point this line at the test copy — THE QUOTES
        #   ARE REQUIRED (the folder name contains a space):
        #       run: python "testing area/twitter_v3.py"
        # • Check BOTH the Discord post(s) AND this workflow's log.
        # • Switch between engines by pointing the run line to:
        #       run: python "testing area/twitter_v1.py"               <- V1 (plain, no API key)
        #       run: python "testing area/twitter_v2_button_outside.py" <- V2 (card, buttons outside)
        #       run: python "testing area/twitter_v3.py"                <- V3 (card, buttons nested)
        # ───────────────────────────────────────────────────────────────────
        run: |
          echo "TWITTER_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          set -o pipefail
          set +e
          python "testing area/twitter_v3.py" 2>&1 | tee twitter_monitor.log   # ← V3
          statuses=("${PIPESTATUS[@]}")
          echo "TWITTER_END_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          if [ "${statuses[0]}" -ne 0 ] || [ "${statuses[1]}" -ne 0 ]; then
            exit 1
          fi

      - name: Persist updated posted_tweets.json cache (retry safely on a concurrent main update)
        env:
          CACHE_BRANCH: ${{ github.ref_name }}
        run: |
          cache_result=failed
          echo "TWITTER_CACHE_RESULT=failed" >> "$GITHUB_ENV"
          set -o pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f posted_tweets.json

          if git diff --cached --quiet; then
            echo "No cache changes to push."
            cache_result=no-changes
            echo "TWITTER_CACHE_RESULT=no-changes" >> "$GITHUB_ENV"
          else
            if ! git commit -m "auto: update posted_tweets.json cache"; then
              echo "::error::CACHE COMMIT FAILED — dedup cache was not persisted; rerun this monitor after resolving the repository state."
              exit 1
            fi

            cache_branch="${CACHE_BRANCH:-main}"
            # Round 61 (2026-10-04): save OUR freshly-written cache aside —
            # the recovery below resets to the live tip and re-merges it
            # SEMANTICALLY (union of dedup keys; git's line merge turned the
            # 2026-10-03 Reddit collision into a fatal conflict instead).
            ours_dir="$(mktemp -d)"
            if [ -f posted_tweets.json ]; then cp posted_tweets.json "$ours_dir/posted_tweets.json"; fi
            pushed=0
            attempts=0
            for attempt in 1 2 3; do
              attempts="$attempt"
              if git push origin "HEAD:${cache_branch}"; then
                pushed=1
                break
              fi

              # A remote cache commit landed between our sync and this push.
              # Reset to the live tip, semantically merge our cache onto it,
              # then retry with bounded backoff.
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::Cache push attempt $attempt/3 failed; merging the live ${cache_branch} tip semantically before retry."
                if ! git fetch origin "$cache_branch"; then
                  echo "::error::CACHE PUSH RECOVERY FAILED — could not fetch the live tip; dedup cache was not persisted."
                  break
                fi
                git reset --hard FETCH_HEAD
                if ! python .github/scripts/merge_monitor_caches.py "$ours_dir" . posted_tweets.json; then
                  echo "::error::CACHE PUSH RECOVERY FAILED — semantic merge failed; dedup cache was not persisted."
                  break
                fi
                git add -f posted_tweets.json
                if git diff --cached --quiet; then
                  echo "Live tip already contains our cache state — nothing left to push."
                  pushed=1
                  break
                fi
                if ! git commit -m "auto: update posted_tweets.json cache"; then
                  echo "::error::CACHE PUSH RECOVERY FAILED — merge commit failed; dedup cache was not persisted."
                  break
                fi
                sleep "$((attempt * 15))"
              fi
            done

            if [ "$pushed" -ne 1 ]; then
              echo "::error::CACHE PUSH FAILED after ${attempts}/3 attempt(s) — dedup cache was not persisted; the next run may re-post. Rerun this monitor after GitHub recovers."
              exit 1
            fi
          fi
          if [ "$cache_result" != "no-changes" ]; then echo "TWITTER_CACHE_RESULT=success" >> "$GITHUB_ENV"; fi

      - name: Write Twitter monitor run summary
        if: always()
        run: |
          if [ -s twitter_monitor.log ]; then log_coverage=available; else log_coverage=unavailable; fi
          [ -f twitter_monitor.log ] || : > twitter_monitor.log
          count_matches() { local pattern="$1"; grep -Ec "$pattern" twitter_monitor.log 2>/dev/null || true; }
          total_feed_entries() { local total; total=$(grep 'feed OK via' twitter_monitor.log 2>/dev/null | grep -Eo '[0-9]+ entries' | grep -Eo '[0-9]+' | awk '{ total += $1 } END { print total + 0 }' || true); printf '%s\n' "${total:-0}"; }
          feed_lines() { sed -E 's/^.*\[(DEBUG|INFO|WARNING|ERROR|CRITICAL)\][[:space:]]*//' twitter_monitor.log; }
          feed_failures() { feed_lines | awk '/^\[[^]]+\] NO working nitter instance this run/ { n++ } END { print n + 0 }' 2>/dev/null || true; }
          runtime=unavailable
          if [ -n "${TWITTER_START_EPOCH:-}" ] && [ -n "${TWITTER_END_EPOCH:-}" ]; then
            runtime="$(( TWITTER_END_EPOCH - TWITTER_START_EPOCH ))s"
          fi
          feeds_ok=$(count_matches 'feed OK via')
          feeds_failed=$(feed_failures)
          feeds_empty=$(count_matches 'skipping — no feed / 0 entries')
          entries_read=$(total_feed_entries)
          {
            echo "## Twitter Feed Monitor — run summary"
            echo
            if [ "${{ job.status }}" = "success" ]; then echo "**Result:** success"; else echo "**Result:** failure"; fi
            echo "**Runtime:** ${runtime}"
            echo
            echo "### Feeds"
            echo "- counts describe matching local log records, not an independent delivery/source-health audit"
            if [ "$feeds_ok" -eq 0 ] && [ "$feeds_failed" -eq 0 ] && [ "$feeds_empty" -eq 0 ]; then
              echo "- observation coverage: unavailable (no matching feed records)"
            fi
            accounts_checked=$(feed_lines | awk '/^\[[^]]+\] feed OK via/ || /^\[[^]]+\] NO working nitter instance this run/ || /^\[[^]]+\] skipping — no feed \/ 0 entries/ { account=$0; sub(/^\[/, "", account); sub(/\].*$/, "", account); print account }' 2>/dev/null | sort -u | wc -l | tr -d ' ' || true)
            echo "- accounts observed in feed logs: ${accounts_checked}"
            echo "- entries read: ${entries_read}"
            echo "- successful feeds: ${feeds_ok}"
            echo "- failed feeds: ${feeds_failed}"
            echo "- empty feeds: ${feeds_empty}"
            echo
            echo "### Posts"
            echo "- new candidates: not separately measured by this log format"
            echo "- posts delivered: $(count_matches 'V3 Posted:')"
            # Round 96b: name WHICH accounts fed and which instance answered, so a
            # "successful feeds: 4" count never leaves the reader guessing which
            # account was dark. Host only (no path/query), sorted, bounded.
            per_account=$(feed_lines | sed -nE \
              -e 's/^\[([^]]+)\] feed OK via https?:\/\/([^\/ ]+)[^—]*— ([0-9]+) entries\..*/- \1: ok via \2 — \3 entries/p' \
              -e 's/^\[([^]]+)\] NO working nitter instance this run.*/- \1: FAILED — no working nitter instance this run/p' \
              -e 's/^\[([^]]+)\] skipping — no feed.*/- \1: empty feed (0 entries)/p' \
              2>/dev/null | sort -u || true)
            if [ -n "$per_account" ]; then
              echo "- per account:"
              printf '%s\n' "$per_account" | head -n 12 | sed 's/^/  /'
              per_account_lines=$(printf '%s\n' "$per_account" | wc -l | tr -d ' ')
              if [ "$per_account_lines" -gt 12 ]; then
                echo "  - … $((per_account_lines - 12)) more account(s) not shown"
              fi
            else
              echo "- per account: unavailable (no matching feed records)"
            fi
            # Round 96b: list the delivered keys (bounded) instead of only a count.
            posted_keys=$(grep -o 'V3 Posted: [^ ]*' twitter_monitor.log 2>/dev/null \
              | sed 's/^V3 Posted: //' | head -n 10 | sed 's/^/- /' || true)
            if [ -n "$posted_keys" ]; then
              echo "- delivered keys:"
              printf '%s\n' "$posted_keys" | sed 's/^/  /'
              posted_total=$(count_matches 'V3 Posted:')
              if [ "$posted_total" -gt 10 ]; then
                echo "  - … $((posted_total - 10)) more not shown"
              fi
            fi
            echo "- skip log lines: $(count_matches 'skipping')"
            echo "- retry/fallback log lines: $(count_matches 'trying next|retry')"
            echo
            echo "### Diagnostics (matching log lines, not unique posts)"
            if [ "$log_coverage" = available ]; then
              echo "- Discord delivery errors: $(count_matches 'Discord error [0-9]')"
              echo "- FxTwitter fetch errors: $(count_matches 'Error fetching FxTwitter data')"
              echo "- media-heal unresolved: $(count_matches 'media still unresolved after')"
              echo "- media-heal edit errors: $(count_matches 'MEDIA-HEAL .*: edit (HTTP|error)')"
              echo "- dedup guard errors: $(count_matches 'DEDUP GUARD:')"
            else
              echo "- diagnostic coverage: unavailable (empty or missing log)"
            fi
            echo
            echo "### Dedup / backlog state (round 95c)"
            v3_summary=$(grep -o 'V3 SUMMARY:.*' twitter_monitor.log 2>/dev/null | tail -n 1 || true)
            if [ -n "$v3_summary" ]; then
              echo "- engine: ${v3_summary#V3 SUMMARY: }"
            else
              echo "- engine: unavailable (no V3 SUMMARY line — the engine did not reach the end of its run, so per-run post/skip counts are unknown)"
            fi
            stale_logged=$(count_matches 'STALE-SKIP:')
            echo "- entries refused as stale backlog: ${stale_logged}"
            # Round 96b: name the refused backlog entries (bounded), with their age,
            # so "3 stale" is verifiable without the Actions log.
            stale_keys=$(grep -o '\[[^]]*\] STALE-SKIP: entry is [0-9.]* h old' twitter_monitor.log 2>/dev/null \
              | sed -E 's/^\[([^]]*)\] STALE-SKIP: entry is ([0-9.]+) h old/- \1 — \2 h old/' \
              | head -n 5 || true)
            if [ -n "$stale_keys" ]; then
              echo "- refused keys (oldest-first as logged):"
              printf '%s\n' "$stale_keys" | sed 's/^/  /'
              stale_total=$(count_matches 'STALE-SKIP:')
              if [ "$stale_total" -gt 5 ]; then
                echo "  - … $((stale_total - 5)) more not shown"
              fi
            fi
            # Round 96b: the engine's own line is authoritative; if the log has a
            # different number of matching lines, the log was truncated and the
            # reader should trust the engine values, not the line counts.
            if [ -n "$v3_summary" ]; then
              engine_stale=$(printf '%s' "$v3_summary" | sed -nE 's/.*stale_skipped=([0-9]+).*/\1/p')
              engine_posted=$(printf '%s' "$v3_summary" | sed -nE 's/.*posted=([0-9]+).*/\1/p')
              posted_logged=$(count_matches 'V3 Posted:')
              if [ -n "$engine_stale" ] && [ "$engine_stale" != "$stale_logged" ]; then
                echo "- note: engine reported ${engine_stale} stale-skip(s), this log has ${stale_logged} line(s) — trust the engine value (the log may be truncated)."
              fi
              if [ -n "$engine_posted" ] && [ "$engine_posted" != "$posted_logged" ]; then
                echo "- note: engine reported ${engine_posted} delivered post(s), this log has ${posted_logged} 'V3 Posted' line(s) — trust the engine value (the log may be truncated)."
              fi
            fi
            echo "- already-posted entries skipped by cache: see dedup_skipped above"
            echo "- why this matters: the cache prevents re-posts only for keys it holds. A down/restoring nitter instance can answer with days-old entries; the stale floor refuses those BEFORE any tweet-data request, so a stale feed can never turn into a re-post or a burst of old cards."
            echo
            echo "### State"
            echo "- cache: ${TWITTER_CACHE_RESULT:-not-reached}"
            if [ "${TWITTER_CACHE_RESULT:-not-reached}" = "failed" ]; then
              echo "- WARNING: the dedup cache was not persisted this run — keys posted this run may be re-posted next run if the feed still lists them. Re-run the monitor once GitHub is healthy."
            fi
            echo "- summary source: local twitter_monitor.log only; no additional requests"
          } >> "$GITHUB_STEP_SUMMARY"
