# ---------------------------------------------------------------------------
# OPTIONAL: automatically MERGE Dependabot PRs once CI is green.
#
# This is DISABLED by default. To enable it:
#   Repo -> Settings -> Secrets and variables -> Actions -> Variables
#   -> New repository variable:  AUTO_MERGE_DEPENDABOT  =  yes
#
# Security model:
#   • workflow_run executes this trusted, default-branch file only after the
#     named CI workflow completes; it never checks out or executes PR code.
#   • the PR author must be dependabot[bot] (human PRs are never touched).
#   • CI must succeed and all checks on the exact PR SHA must be green.
#   • the PR must be cleanly mergeable.
#
# Nothing here touches main unless every gate passes. See docs/DEPENDABOT.md.
# ---------------------------------------------------------------------------
name: Dependabot auto-merge (opt-in)

on:
  workflow_run:
    workflows: ["CI — syntax + offline smoke test"]
    types: [completed]

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Round 57: hard cap — single API script; seconds normally.
    timeout-minutes: 5
    # Gate 0: only runs when the variable is set to "yes" (empty = off).
    if: vars.AUTO_MERGE_DEPENDABOT == 'yes'
    steps:
      # No checkout by design: workflow_run uses the trusted default-branch
      # workflow definition, and this job never executes PR-supplied code.
      - name: Evaluate + merge eligible Dependabot PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9 — SHA-pinned (round 57)
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.conclusion !== 'success') {
              console.log(`CI conclusion=${run.conclusion}; not merging.`);
              return;
            }

            // Push runs have no PR. A CI run normally maps to exactly one PR;
            // skip any unusual association rather than guessing.
            const prs = run.pull_requests || [];
            if (prs.length !== 1) {
              console.log(`Expected one PR for the completed CI run; found ${prs.length}. Skipping.`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = prs[0].number;
            let pr;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number }));
              if (pr.mergeable_state !== 'unknown') break;
              console.log(`mergeable_state=unknown (attempt ${attempt}/3); waiting for GitHub.`);
              await new Promise(resolve => setTimeout(resolve, 3000));
            }

            if (pr.user.login !== 'dependabot[bot]') {
              console.log(`PR author is ${pr.user.login}; only dependabot[bot] is eligible.`);
              return;
            }
            if (pr.draft) { console.log('Draft PR — skipping.'); return; }
            if (pr.state !== 'open') { console.log('PR not open — skipping.'); return; }
            if (pr.mergeable_state !== 'clean') {
              console.log(`mergeable_state=${pr.mergeable_state} — skipping.`);
              return;
            }

            const { data: checks } = await github.rest.checks.listForRef({
              owner, repo, ref: pr.head.sha, per_page: 100,
            });
            if (!checks.check_runs || checks.check_runs.length === 0) {
              console.log('No checks have run yet — skipping (safety).');
              return;
            }
            const pending = checks.check_runs.filter(c => c.status !== 'completed');
            const bad = checks.check_runs.filter(
              c => c.status === 'completed' && !['success', 'skipped', 'neutral'].includes(c.conclusion));
            if (pending.length) {
              console.log(`${pending.length} check(s) still running — skipping.`);
              return;
            }
            if (bad.length) {
              console.log(`Failed check(s): ${bad.map(c => c.name).join(', ')} — NOT merging.`);
              return;
            }

            console.log('All checks green on an eligible Dependabot PR — merging.');
            await github.rest.pulls.merge({
              owner, repo, pull_number: number, merge_method: 'squash',
            });
