# Automatic CPython pin proposer. Policy lives in .github/scripts/maintenance.py.
# This workflow selects, validates, and publishes a PR. It never self-merges;
# ordinary PR CI plus maintenance_merge.yml decide on the actual latest head.
#
# BUMP_PAT is isolated to the publish step. Missing credentials are a
# configuration error, not a fallback to GITHUB_TOKEN (which can suppress
# normal pull_request CI).

name: Python version bump (auto)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Bump to this exact version instead of auto-detecting (optional)'
        required: false
        default: ''
      ignore_soak:
        description: 'Skip the soak period for a new minor series'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: python-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.resolve.outputs.status }}
      current: ${{ steps.resolve.outputs.current }}
      candidate: ${{ steps.resolve.outputs.candidate }}
      kind: ${{ steps.resolve.outputs.kind }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version-file: .python-version

      - name: Select a candidate from the setup-python manifest
        id: resolve
        env:
          FORCE_VERSION: ${{ inputs.force_version }}
          IGNORE_SOAK: ${{ inputs.ignore_soak }}
          SOAK_DAYS: ${{ vars.PYTHON_BUMP_SOAK_DAYS }}
        run: |
          set -euo pipefail
          curl -fsSL -o manifest.json \
            https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
          ARGS=(--manifest manifest.json)
          if [ -n "${FORCE_VERSION:-}" ]; then ARGS+=(--force "$FORCE_VERSION"); fi
          if [ "${IGNORE_SOAK:-}" = "true" ]; then ARGS+=(--ignore-soak); fi
          if [ -n "${SOAK_DAYS:-}" ]; then ARGS+=(--soak-days "$SOAK_DAYS"); fi
          python .github/scripts/python_version_bump.py "${ARGS[@]}" | tee selection.json
          python - <<'PY'
          import json, os
          data = json.load(open("selection.json", encoding="utf-8"))
          out = os.environ["GITHUB_OUTPUT"]
          def w(k, v):
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"{k}={v}\n")
          w("status", data.get("status") or "failed")
          w("current", data.get("current") or "")
          w("candidate", data.get("candidate") or "")
          w("kind", data.get("kind") or "")
          w("reason", data.get("reason") or "")
          PY

  validate:
    needs: select
    if: needs.select.outputs.status == 'proposed' || needs.select.outputs.status == 'review-required'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      wheels: ${{ steps.wheels.outputs.ok }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          persist-credentials: false

      - name: Install the candidate interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version: ${{ needs.select.outputs.candidate }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Assert the interpreter equals the candidate
        run: |
          python - <<'PY'
          import sys
          expected = "${{ needs.select.outputs.candidate }}".strip()
          actual = ".".join(str(p) for p in sys.version_info[:3])
          if actual != expected:
              raise SystemExit(f"interpreter {actual} != candidate {expected}")
          print("interpreter", actual)
          PY

      - name: Frozen wheels-only install
        id: wheels
        run: |
          set +e
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "::notice::No prebuilt wheels yet for $(python --version) — deferring this bump."
            exit 0
          fi
          echo "ok=yes" >> "$GITHUB_OUTPUT"

      - name: Validate the candidate tree
        if: steps.wheels.outputs.ok == 'yes'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          python .github/scripts/ci.py --profile production --group application
          python .github/scripts/ci.py --profile production --group maintenance

      - name: Rewrite only the documented runtime pin
        if: steps.wheels.outputs.ok == 'yes'
        run: |
          python .github/scripts/python_version_bump.py --write-pin --candidate "${{ needs.select.outputs.candidate }}"
          if git diff --name-only -- docs/history/ | grep -q .; then
            echo "::error::Historical files changed by runtime rewrite"
            exit 1
          fi
          UNEXPECTED="$(git diff --name-only | grep -v '^\.python-version$' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected file changed:"
            printf '%s\n' "$UNEXPECTED"
            exit 1
          fi

      - name: Re-validate after the pin rewrite
        if: steps.wheels.outputs.ok == 'yes'
        run: |
          python .github/scripts/ci.py --profile production --group application
          python .github/scripts/ci.py --profile production --group maintenance

  publish:
    needs: [select, validate]
    if: >-
      needs.validate.outputs.wheels == 'yes' &&
      (needs.select.outputs.status == 'proposed' || needs.select.outputs.status == 'review-required')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require BUMP_PAT
        env:
          BUMP_PAT: ${{ secrets.BUMP_PAT }}
        run: |
          if [ -z "${BUMP_PAT}" ]; then
            echo "::error::BUMP_PAT is missing — configuration error, not a GITHUB_TOKEN fallback."
            exit 1
          fi

      - name: Check out with the publisher token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          token: ${{ secrets.BUMP_PAT }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version-file: .python-version

      - name: Apply the validated pin and open or update the proposal
        env:
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
          CURRENT: ${{ needs.select.outputs.current }}
          LATEST: ${{ needs.select.outputs.candidate }}
          KIND: ${{ needs.select.outputs.kind }}
          STATUS: ${{ needs.select.outputs.status }}
        run: |
          set -euo pipefail
          python .github/scripts/python_version_bump.py --write-pin --candidate "$LATEST"
          BRANCH="chore/python-${LATEST}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          if git diff --quiet -- .python-version; then
            echo "Empty pin diff — no PR."
            exit 0
          fi
          git add .python-version
          git commit -m "chore: bump CPython pin ${CURRENT} -> ${LATEST}"
          git push --force-with-lease origin "$BRANCH"
          BODY=$(cat <<EOF
          Automated ${KIND} proposal for the pinned CPython runtime (\`.python-version\`).

          | | |
          |---|---|
          | From | \`${CURRENT}\` |
          | To | \`${LATEST}\` |
          | Kind | ${KIND} |
          | Selection | ${STATUS} |

          Pre-PR validation ran under \`${LATEST}\` with the frozen hashed graph
          (\`pip install --require-hashes --only-binary=:all:\`) and the CI adapter
          (\`ci.py --profile production\`). Ordinary PR CI on this head is still
          required; this workflow does not merge.
          EOF
          )
          EXISTING="$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' || true)"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "chore: bump CPython pin ${CURRENT} -> ${LATEST} (${KIND})" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: bump CPython pin ${CURRENT} -> ${LATEST} (${KIND})" \
              --body "$BODY"
          fi

  summary:
    if: always()
    needs: [select, validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write job summary
        run: |
          {
            echo "### Python version bump"
            echo ""
            echo "* current pin: \`${{ needs.select.outputs.current }}\`"
            echo "* candidate: \`${{ needs.select.outputs.candidate || 'none' }}\`"
            echo "* status: \`${{ needs.select.outputs.status }}\`"
            echo "* reason: \`${{ needs.select.outputs.reason }}\`"
            echo "* kind: \`${{ needs.select.outputs.kind || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
