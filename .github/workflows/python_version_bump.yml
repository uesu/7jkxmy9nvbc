#  Automatic CPython runtime proposer — thin selection / validation / publish
#  stages only. Every policy rule lives in .github/scripts/maintenance.py, which
#  is shared verbatim with the News development repository and the other News
#  production repository; the inline version-selection program that used to be
#  duplicated here is gone.
#
#  WHAT CHANGED FROM THE PREVIOUS VERSION
#    * The exact pin is read from .python-version (the single runtime source of
#      truth), not scraped out of a workflow file.
#    * No README/doc rewrite: production copies ship no development Markdown,
#      and absent optional docs are NOT an error. The only runtime file this
#      workflow rewrites is .python-version.
#    * NO SELF-MERGE. The proposer publishes one deterministic proposal and
#      stops; ordinary PR CI plus .github/workflows/maintenance_merge.yml decide
#      on the actual latest PR head. A successful pre-PR test is useful but is
#      not a substitute for final-head validation.
#    * A missing release date no longer bypasses the soak: it reports
#      `deferred: release-date-unavailable`, which is distinct from `up-to-date`.
#
#  SCOPE: at most the newest patch of the current series, or the next minor
#  after the configured soak — and a minor always stays on the human-review
#  path. A major migration is never routine. There is deliberately no `all`
#  auto-merge mode.
#
#  AUTHENTICATION: secrets.BUMP_PAT is exposed to the publish step ONLY.
#  Selection and validation run with no write credentials at all. A missing
#  token is an explicit configuration error, never a fallback to a token whose
#  events would silently suppress normal PR CI.

name: Python version bump (auto)

on:
  schedule:
    # Mondays 06:00 UTC. This is the maintenance schedule; it never runs a
    # monitor. cron-job.org remains the single monitor scheduler.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Propose this exact version instead of auto-detecting (optional; a non-patch override stays review-required)'
        required: false
        default: ''
      ignore_soak:
        description: 'Skip the soak period for a new minor series (the minor still requires human review)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python-bump-${{ github.ref }}
  cancel-in-progress: false

env:
  CHECKOUT_SHA: 3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7
  SETUP_PYTHON_SHA: 5fda3b95a4ea91299a34e894583c3862153e4b97  # actions/setup-python v7

jobs:
  # ---- 1. selection: secret-free, read-only ------------------------------
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.resolve.outputs.status }}
      reason: ${{ steps.resolve.outputs.reason }}
      candidate: ${{ steps.resolve.outputs.candidate }}
      kind: ${{ steps.resolve.outputs.kind }}
      current: ${{ steps.resolve.outputs.current }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          persist-credentials: false

      - name: Set up Python (exact pin from .python-version)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version-file: '.python-version'

      - name: Select the next candidate
        id: resolve
        env:
          SOAK_DAYS: ${{ vars.PYTHON_BUMP_SOAK_DAYS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(resolve --force-version "${{ inputs.force_version }}")
          [ "${{ inputs.ignore_soak }}" = "true" ] && args+=(--ignore-soak)
          [ -n "$SOAK_DAYS" ] && args+=(--soak-days "$SOAK_DAYS")
          python .github/scripts/python_version_bump.py "${args[@]}" | tee selection.txt
          # Re-emit the adapter's outputs for this job.
          python - <<'PY'
          import os, re
          out = os.environ["GITHUB_OUTPUT"]
          with open("selection.txt", encoding="utf-8") as fh:
              text = fh.read()
          # The adapter prints a JSON decision block then key=value lines.
          for line in text.splitlines():
              if re.fullmatch(r"(status|reason|candidate|kind|current|bump)=.*", line):
                  with open(out, "a", encoding="utf-8") as sink:
                      sink.write(line + "\n")
          PY

      - name: Report the decision
        if: always()
        run: |
          {
            echo "## Runtime proposer"
            echo
            echo "- status: \`${{ steps.resolve.outputs.status }}\`"
            echo "- reason: \`${{ steps.resolve.outputs.reason }}\`"
            echo "- current: \`${{ steps.resolve.outputs.current }}\`"
            echo "- candidate: \`${{ steps.resolve.outputs.candidate }}\`"
            echo "- kind: \`${{ steps.resolve.outputs.kind }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- 2. candidate validation: secret-free, PR code never runs ----------
  validate:
    needs: select
    if: needs.select.outputs.status == 'proposed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          persist-credentials: false

      - name: Install the exact candidate interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version: ${{ needs.select.outputs.candidate }}

      - name: The running interpreter must equal the candidate exactly
        run: |
          set -euo pipefail
          actual="$(python -c 'import sys;print("%d.%d.%d" % sys.version_info[:3])')"
          expected="${{ needs.select.outputs.candidate }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::interpreter is $actual, expected $expected"
            exit 1
          fi
          echo "interpreter confirmed: $actual"

      # --only-binary=:all: is the load-bearing flag: aiohttp, multidict, yarl,
      # frozenlist and propcache are C extensions built per interpreter ABI, so
      # a brand-new CPython minor without wheels must DEFER, not compile.
      - name: Prebuilt wheels must exist for the committed frozen graph
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt

      - name: Rewrite ONLY the runtime pin, then re-run the same CI adapter
        run: |
          set -euo pipefail
          printf '%s\n' "${{ needs.select.outputs.candidate }}" > .python-version
          git --no-pager diff --stat
          changed="$(git --no-pager diff --name-only)"
          if [ "$changed" != ".python-version" ]; then
            echo "::error::unexpected files changed: $changed"
            exit 1
          fi
          python .github/scripts/ci.py --profile production

  # ---- 3. publish: the ONLY step that sees BUMP_PAT ----------------------
  publish:
    needs: [select, validate]
    if: needs.select.outputs.status == 'proposed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository with the publisher token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned
        with:
          token: ${{ secrets.BUMP_PAT }}

      - name: Set up Python (exact pin from .python-version)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned
        with:
          python-version-file: '.python-version'

      - name: Validate the candidate for publication
        env:
          BUMP_PAT: ${{ secrets.BUMP_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${BUMP_PAT:-}" ]; then
            echo "::error::BUMP_PAT is not configured; refusing to fall back to a token whose events suppress PR CI."
            exit 1
          fi
          python .github/scripts/python_version_bump.py publish \
            --candidate "${{ needs.select.outputs.candidate }}"

      - name: Publish one deterministic proposal per candidate
        env:
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
          CANDIDATE: ${{ needs.select.outputs.candidate }}
          CURRENT: ${{ needs.select.outputs.current }}
          KIND: ${{ needs.select.outputs.kind }}
        run: |
          set -euo pipefail
          branch="chore/python-${CANDIDATE}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin "$branch" 2>/dev/null && git checkout "$branch" || git checkout -b "$branch"
          printf '%s\n' "$CANDIDATE" > .python-version
          if git diff --quiet && git diff --cached --quiet && git rev-parse --verify "origin/$branch" >/dev/null 2>&1; then
            echo "An identical proposal already exists for $CANDIDATE — no new PR."
            exit 0
          fi
          git add .python-version
          if git diff --cached --quiet; then
            echo "Empty diff: .python-version already pins $CANDIDATE — no PR."
            exit 0
          fi
          git commit -m "chore: bump CPython pin $CURRENT -> $CANDIDATE ($KIND)"
          git push --force-with-lease origin "$branch"
          body="$(cat <<EOF
          Automated runtime proposal ($KIND): \`$CURRENT\` -> \`$CANDIDATE\`.

          - Only \`.python-version\` changes.
          - Validated on the candidate interpreter with prebuilt wheels only,
            then re-validated on the rewritten tree by the shared CI adapter.
          - This PR is NOT self-merged. Ordinary PR CI and
            \`.github/workflows/maintenance_merge.yml\` decide on the final head.
          EOF
          )"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Proposal PR for $branch already exists; updated in place."
          else
            gh pr create --base main --head "$branch" \
              --title "chore: bump CPython pin $CURRENT -> $CANDIDATE ($KIND)" \
              --body "$body" --label dependencies
          fi
