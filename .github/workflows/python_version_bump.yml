#  Automatic CPython version bump (round 46, 2026-10-01)
#
#  WHY THIS EXISTS
#  Dependabot cannot do this. `python-version: '3.14.7'` inside a workflow is
#  repository configuration, not a dependency in a manifest Dependabot parses
#  (see docs/DEPENDABOT.md). So new CPython releases — including SECURITY
#  releases like 3.14.8 — had to be noticed and applied by hand.
#
#  SCOPE: PATCH *AND* MINOR
#  This workflow follows the runtime forward for ever: 3.14.7 -> 3.14.8 (patch)
#  and, when the time comes, 3.14.x -> 3.15.y (minor). It is never allowed to
#  skip a series: from 3.14 it will only ever propose 3.15, never 3.16. The
#  run after that picks up the next one, so every jump stays one reviewable
#  step.
#
#  THE RULE: 100% GREEN OR NOTHING
#  No PR is opened unless, under the NEW interpreter, all of this passed:
#    1. every dependency installed FROM A PREBUILT WHEEL
#       (`--only-binary=:all:`). This is the single most likely way a new
#       CPython minor breaks this repo: aiohttp ships compiled wheels per
#       interpreter ABI (cp310...cp314 today) and so do its C dependencies
#       multidict / yarl / frozenlist / propcache. On the day 3.15.0 lands
#       those wheels do not exist yet, pip would fall back to compiling from
#       source, and that either fails or silently produces a slower, less
#       tested build. Wheels missing => DEFERRED, not merged, not failed.
#    2. `python -m compileall` over the whole tree
#    3. tests/test_smoke.py
#    4. tests/test_reddit_signals.py
#  then the pin is rewritten everywhere and 2-4 are run AGAIN on the rewritten
#  tree (the rewrite edits tests/test_smoke.py itself — see below). Only then
#  is a PR created.
#
#  SOAK PERIOD FOR A NEW MINOR
#  A x.y.0 release is the least-tested build of its series. A minor bump is
#  therefore only proposed once the release has been in the runner image
#  manifest for PYTHON_BUMP_SOAK_DAYS days (repository Variable, default 30).
#  Patch releases have no soak: a patch is usually a security fix and the ABI
#  is stable inside a series.
#
#  AUTO-MERGE (repository Variable AUTO_MERGE_PYTHON_BUMP)
#    unset / anything else -> never merges, just opens the PR
#    'yes'                 -> merges green PATCH bumps; a MINOR bump still
#                             waits for you
#    'all'                 -> merges green minor bumps too
#  A minor bump also leaves prose in docs/ pointing at the old series, which
#  no script should rewrite blind, so 'yes' deliberately stops there.
#
#  REPOSITORY SETTING THIS NEEDS (or doesn't)
#  Opening a PR with the built-in GITHUB_TOKEN requires
#    Settings -> Actions -> General -> Workflow permissions ->
#    "Allow GitHub Actions to create and approve pull requests"
#  to be ticked. It is OFF by default on GitHub. If it is off, this workflow
#  does NOT fail and does NOT silently do nothing: it falls back to pushing
#  the verified branch and, when AUTO_MERGE_PYTHON_BUMP allows this kind of
#  bump, fast-forwards main to it directly (contents: write needs no extra
#  setting). The bump was already proven green twice before that point, so
#  the PR is a review surface, not a safety mechanism.
#  Using a fine-grained PAT in secrets.BUMP_PAT also sidesteps the setting
#  entirely, because the PR is then opened by you, not by Actions.
#
#  NOTE ON PR CHECKS
#  A PR opened with the built-in GITHUB_TOKEN does NOT trigger other
#  workflows, so ci.yml will not post a check on this PR. That is why this
#  job runs the SAME commands ci.yml runs — under the NEW interpreter, which
#  is strictly more informative than CI running them under the old pin. If
#  you want the CI badge on the PR too, create a fine-grained PAT with
#  Contents+Pull requests write, store it as secret BUMP_PAT, and swap the
#  GH_TOKEN lines marked below.

name: Python version bump (auto)

on:
  schedule:
    # Mondays 06:00 UTC. Frequent enough to pick up a security release fast.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Bump to this exact version instead of auto-detecting (optional)'
        required: false
        default: ''
      ignore_soak:
        description: 'Skip the soak period for a new minor series'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: python-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Round 57: hard cap — full validation gate; normal run is minutes.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — SHA-pinned (round 57, immutable supply chain)

      - name: Work out the current pin and the next version to try
        id: resolve
        env:
          FORCE_VERSION: ${{ inputs.force_version }}
          IGNORE_SOAK: ${{ inputs.ignore_soak }}
          SOAK_DAYS: ${{ vars.PYTHON_BUMP_SOAK_DAYS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CURRENT="$(grep -oP "python-version: '\K3\.[0-9]+\.[0-9]+" .github/workflows/ci.yml | head -1)"
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read the current python-version from ci.yml"
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Currently pinned: $CURRENT"

          if [ -n "$FORCE_VERSION" ]; then
            echo "Manual override requested: $FORCE_VERSION"
            echo "latest=$FORCE_VERSION" >> "$GITHUB_OUTPUT"
            echo "kind=forced" >> "$GITHUB_OUTPUT"
            echo "bump=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The manifest setup-python itself resolves from. A version that is
          # not in here cannot be installed by any workflow.
          curl -fsSL -o manifest.json \
            https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json

          # Candidate = newest stable patch of the current series; if the
          # current series has nothing newer, the newest stable patch of the
          # NEXT series (one minor step only — never a double jump).
          python3 - "$CURRENT" <<'PY' > candidate.txt
          import json, sys

          current = tuple(int(p) for p in sys.argv[1].split("."))
          series_now = current[:2]
          series_next = (current[0], current[1] + 1)

          with open("manifest.json", encoding="utf-8") as fh:
              data = json.load(fh)

          def newest(series):
              best, url = None, ""
              for entry in data:
                  raw = entry.get("version", "")
                  if not entry.get("stable"):
                      continue                      # skips rc / beta / alpha
                  parts = raw.split(".")
                  if len(parts) != 3 or not all(p.isdigit() for p in parts):
                      continue
                  version = tuple(int(p) for p in parts)
                  if version[:2] != series:
                      continue
                  if not any(f.get("platform") == "linux" and f.get("arch") == "x64"
                             for f in entry.get("files", [])):
                      continue                      # runners are linux x64
                  if best is None or version > best:
                      best, url = version, entry.get("release_url", "")
              return best, url

          for series, kind in ((series_now, "patch"), (series_next, "minor")):
              best, url = newest(series)
              if best and best > current:
                  print(".".join(str(p) for p in best))
                  print(kind)
                  print(url)
                  break
          else:
              print("")
              print("none")
              print("")
          PY

          LATEST="$(sed -n 1p candidate.txt)"
          KIND="$(sed -n 2p candidate.txt)"
          RELEASE_URL="$(sed -n 3p candidate.txt)"

          if [ -z "$LATEST" ]; then
            echo "Already on the newest usable CPython — nothing to do."
            echo "bump=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Candidate: $LATEST ($KIND bump)"

          # --- soak period, minor bumps only -------------------------------
          if [ "$KIND" = "minor" ] && [ "$IGNORE_SOAK" != "true" ]; then
            DAYS="${SOAK_DAYS:-30}"
            TAG="${RELEASE_URL##*/}"
            PUBLISHED="$(gh api "repos/actions/python-versions/releases/tags/${TAG}" \
                           --jq '.published_at' 2>/dev/null || true)"
            if [ -n "$PUBLISHED" ]; then
              AGE=$(( ( $(date -u +%s) - $(date -u -d "$PUBLISHED" +%s) ) / 86400 ))
              echo "Release $TAG published $PUBLISHED (${AGE} days ago); soak = ${DAYS} days."
              if [ "$AGE" -lt "$DAYS" ]; then
                echo "::notice::$LATEST is a new minor series and is only ${AGE} days old (soak ${DAYS}). Deferred."
                echo "bump=no" >> "$GITHUB_OUTPUT"
                echo "deferred=soak (${AGE}/${DAYS} days)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "::warning::Could not read the release date for $TAG — soak check skipped."
            fi
          fi

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND"     >> "$GITHUB_OUTPUT"
          echo "bump=yes"       >> "$GITHUB_OUTPUT"

      # ---- THE GATE: install the candidate and prove the repo works on it --
      - name: Install the candidate interpreter
        if: steps.resolve.outputs.bump == 'yes'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7 — SHA-pinned (round 57)
        with:
          python-version: ${{ steps.resolve.outputs.latest }}
          cache: 'pip'

      # --only-binary=:all: is the load-bearing flag here. aiohttp, multidict,
      # yarl, frozenlist and propcache are C extensions built per interpreter
      # ABI tag. A brand-new CPython minor has no such wheels for days or
      # weeks. Without this flag pip would quietly compile them from source;
      # with it, the bump is DEFERRED until the ecosystem has caught up.
      - name: Dependency wheels must exist for this interpreter
        if: steps.resolve.outputs.bump == 'yes'
        id: wheels
        run: |
          set +e
          python --version
          python -m pip install --upgrade pip >/dev/null
          pip install --only-binary=:all: -r requirements.txt
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "::notice::No prebuilt wheels yet for $(python --version) — deferring this bump."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
            pip list
          fi

      - name: Verify the repository under the candidate interpreter
        if: steps.resolve.outputs.bump == 'yes' && steps.wheels.outputs.ok == 'yes'
        run: |
          set -euo pipefail
          python -m compileall -q "testing area" tests
          python tests/test_smoke.py
          python tests/test_reddit_signals.py

      - name: Rewrite the pin everywhere it appears
        if: steps.resolve.outputs.bump == 'yes' && steps.wheels.outputs.ok == 'yes'
        id: rewrite
        env:
          CURRENT: ${{ steps.resolve.outputs.current }}
          LATEST: ${{ steps.resolve.outputs.latest }}
        run: |
          set -euo pipefail
          # Every tracked text file that mentions the old version, excluding
          # this workflow's own documentation of the mechanism.
          # *.py is included on purpose: tests/test_smoke.py (round 39)
          # asserts the exact pinned version, so a bump that skipped it would
          # merge a red CI. Verified afterwards by re-running the suites.
          mapfile -t FILES < <(grep -rl --fixed-strings "$CURRENT" \
            --include='*.yml' --include='*.yaml' --include='*.md' \
            --include='*.txt' --include='*.cfg' --include='*.toml' \
            --include='*.py' . \
            | grep -v '^./.github/workflows/python_version_bump.yml$' || true)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::The pin $CURRENT was not found in any file — aborting."
            exit 1
          fi

          printf 'Updating: %s\n' "${FILES[@]}"
          sed -i "s/${CURRENT}/${LATEST}/g" "${FILES[@]}"

          # python.org release links look like .../release/python-3147/
          OLD_SLUG="python-$(echo "$CURRENT" | tr -d '.')"
          NEW_SLUG="python-$(echo "$LATEST"  | tr -d '.')"
          grep -rl --fixed-strings "$OLD_SLUG" --include='*.md' . \
            | xargs -r sed -i "s/${OLD_SLUG}/${NEW_SLUG}/g"

          # Prose that names the OLD SERIES ("the 3.14 line", "CPython 3.14")
          # is deliberately NOT rewritten: a blind series-wide sed would also
          # hit unrelated numbers such as `aiohttp>=3.14.3`. Instead the
          # leftovers are listed in the PR so a human can edit them.
          OLD_SERIES="${CURRENT%.*}"
          NEW_SERIES="${LATEST%.*}"
          LEFTOVERS=""
          if [ "$OLD_SERIES" != "$NEW_SERIES" ]; then
            LEFTOVERS="$(grep -rn --include='*.md' -E "(CPython|Python) ${OLD_SERIES}([^.0-9]|$)" . \
                         | grep -v '^./docs/CHANGELOG' | head -20 || true)"
          fi
          {
            echo 'leftovers<<EOF'
            echo "${LEFTOVERS:-}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          echo "---- diff ----"
          git --no-pager diff --stat

      # The rewrite touches the test suite itself (the round-39 pin guard),
      # so the tree is verified AGAIN afterwards. This is the gate that
      # decides whether a PR is opened at all: if the bumped tree is not
      # green, the job fails here and nothing is proposed.
      - name: Re-verify the REWRITTEN tree
        if: steps.resolve.outputs.bump == 'yes' && steps.wheels.outputs.ok == 'yes'
        run: |
          set -euo pipefail
          python -m compileall -q "testing area" tests
          python tests/test_smoke.py
          python tests/test_reddit_signals.py

      - name: Open the pull request
        if: steps.resolve.outputs.bump == 'yes' && steps.wheels.outputs.ok == 'yes'
        id: pr
        env:
          # Swap to ${{ secrets.BUMP_PAT }} if you want ci.yml to run on the PR.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.resolve.outputs.current }}
          LATEST: ${{ steps.resolve.outputs.latest }}
          KIND: ${{ steps.resolve.outputs.kind }}
          LEFTOVERS: ${{ steps.rewrite.outputs.leftovers }}
        run: |
          set -euo pipefail
          BRANCH="chore/python-${LATEST}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -aqm "chore: bump CPython pin ${CURRENT} -> ${LATEST}"
          git push -q --force-with-lease origin "$BRANCH"

          NOTE=""
          if [ "$KIND" = "minor" ]; then
            NOTE=$'\n### ⚠️ This is a MINOR series bump\n\nIt was only proposed because every gate above passed on the new series, including a wheels-only dependency install. Prose in `docs/` that names the old series is **not** rewritten automatically (a blind series-wide replace would also corrupt unrelated numbers such as `aiohttp>=3.14.3`). Leftovers to review:\n\n```\n'"${LEFTOVERS:-none found}"$'\n```\n'
          fi

          # Settings -> Actions -> General -> Workflow permissions ->
          # "Allow GitHub Actions to create and approve pull requests" may be
          # off (GitHub's default). Detect that instead of failing the job.
          set +e
          URL="$(gh pr create \
            --base main --head "$BRANCH" \
            --title "chore: bump CPython pin ${CURRENT} -> ${LATEST} (${KIND})" \
            --body "$(cat <<EOF
          Automated ${KIND} bump of the pinned CPython runtime.

          | | |
          |---|---|
          | From | \`${CURRENT}\` |
          | To | \`${LATEST}\` |
          | Kind | ${KIND} |
          | Release notes | https://www.python.org/downloads/release/python-$(echo "${LATEST}" | tr -d '.')/ |

          ### Verified before this PR was opened

          \`${LATEST}\` was installed from the actions/python-versions manifest
          (the same source \`setup-python\` resolves from, so the pin is known to
          be installable), and under that interpreter this job ran:

          * \`pip install --only-binary=:all: -r requirements.txt\` — every
            dependency came from a prebuilt wheel for this interpreter; nothing
            was compiled from source
          * \`python -m compileall -q "testing area" tests\`
          * \`python tests/test_smoke.py\`
          * \`python tests/test_reddit_signals.py\`

          The pin was then rewritten everywhere (workflows, docs, and the
          round-39 guard in \`tests/test_smoke.py\`) and \`compileall\` plus both
          suites were run AGAIN on the rewritten tree.

          All of them passed — the PR is only created when they do.
          ${NOTE}
          > Note: PRs opened with \`GITHUB_TOKEN\` do not trigger \`ci.yml\`, so no
          > check appears below. The commands above are the same ones CI runs,
          > executed under the NEW interpreter.
          EOF
          )" 2>pr_error.txt)"
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ] || [ -z "$URL" ]; then
            cat pr_error.txt || true
            if grep -qi "not permitted to create\|pull request creation\|GitHub Actions is not permitted" pr_error.txt; then
              echo "::warning::This repository does not allow GitHub Actions to create pull requests (Settings -> Actions -> General -> Workflow permissions). Falling back to a direct update."
              echo "blocked=settings" >> "$GITHUB_OUTPUT"
              echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::gh pr create failed for a reason other than repository settings."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Opened $URL"

      # AUTO_MERGE_PYTHON_BUMP: 'yes' = patch bumps, 'all' = minor bumps too.
      - name: Merge it (only when AUTO_MERGE_PYTHON_BUMP allows this kind)
        if: >-
          steps.pr.outputs.url != '' &&
          (vars.AUTO_MERGE_PYTHON_BUMP == 'all' ||
           (vars.AUTO_MERGE_PYTHON_BUMP == 'yes' && steps.resolve.outputs.kind != 'minor'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          gh pr merge "$URL" --squash --delete-branch
          echo "Merged $URL"

      # Fallback when the repository forbids Actions from opening PRs. The
      # tree being pushed is the one that just passed compileall + both test
      # suites TWICE under the new interpreter, so this is the same content
      # the PR would have carried — only the review surface is missing.
      - name: Update main directly (only when a PR was blocked by settings)
        if: >-
          steps.pr.outputs.blocked == 'settings' &&
          (vars.AUTO_MERGE_PYTHON_BUMP == 'all' ||
           (vars.AUTO_MERGE_PYTHON_BUMP == 'yes' && steps.resolve.outputs.kind != 'minor'))
        env:
          CURRENT: ${{ steps.resolve.outputs.current }}
          LATEST: ${{ steps.resolve.outputs.latest }}
        run: |
          set -euo pipefail
          git push origin "HEAD:main"
          git push origin --delete "${{ steps.pr.outputs.branch }}" || true
          echo "Pushed the verified bump ${CURRENT} -> ${LATEST} straight to main."

      - name: Tell me a branch is waiting (PR blocked, auto-merge off)
        if: >-
          steps.pr.outputs.blocked == 'settings' &&
          !(vars.AUTO_MERGE_PYTHON_BUMP == 'all' ||
            (vars.AUTO_MERGE_PYTHON_BUMP == 'yes' && steps.resolve.outputs.kind != 'minor'))
        run: |
          echo "::warning::Verified bump pushed to branch ${{ steps.pr.outputs.branch }}, but this repository does not allow Actions to open PRs and auto-merge is not enabled for this bump kind. Open the PR yourself from that branch, or tick Settings -> Actions -> General -> Workflow permissions -> 'Allow GitHub Actions to create and approve pull requests'."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Python version bump"
            echo ""
            echo "* current pin: \`${{ steps.resolve.outputs.current }}\`"
            echo "* candidate: \`${{ steps.resolve.outputs.latest || 'none' }}\` (${{ steps.resolve.outputs.kind || 'n/a' }})"
            echo "* wheels available: \`${{ steps.wheels.outputs.ok || 'n/a' }}\`"
            echo "* deferred: \`${{ steps.resolve.outputs.deferred || 'no' }}\`"
            echo "* pull request: ${{ steps.pr.outputs.url || 'none opened' }}"
            echo "* PR blocked by repo settings: \`${{ steps.pr.outputs.blocked || 'no' }}\`"
            echo "* branch: \`${{ steps.pr.outputs.branch || 'none' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
