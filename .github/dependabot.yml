# Dependabot — frozen pip graph + GitHub Actions SHA pins.
# Routine patch/minor package updates are grouped separately from majors.
# There is no Actions lockfile integration.
#
# Merges are decided by maintenance_merge.yml, not by this file.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Compiled hashed requirements.txt is the lock Dependabot regenerates.
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(python)"
    groups:
      python-routine:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    # Major upgrades stay ungrouped so they cannot hide inside the routine PR.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-routine:
        patterns: ["*"]
        update-types: ["patch", "minor"]
